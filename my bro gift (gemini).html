<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Night Blossom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #020617 0%, #1e1b4b 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
        }
        .message {
            position: absolute;
            bottom: 40px;
            font-family: 'Georgia', serif;
            color: #fce7f3;
            text-align: center;
            width: 100%;
            text-shadow: 0 0 10px rgba(244, 114, 182, 0.5);
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="message">
        <h1 class="text-2xl italic">"A time like a spring with blossom tree night"</h1>
        <p class="text-sm opacity-70 mt-2">For Hema, 2026</p>
    </div>
    <canvas id="blossomCanvas"></canvas>

    <script>
        const canvas = document.getElementById('blossomCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let petals = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Petal {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = -20;
                this.size = Math.random() * 5 + 2;
                this.speed = Math.random() * 1 + 0.5;
                this.wind = Math.random() * 1 - 0.5;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 2 - 1;
                this.opacity = Math.random() * 0.5 + 0.3;
            }

            update() {
                this.y += this.speed;
                this.x += this.wind;
                this.rotation += this.rotationSpeed;

                if (this.y > height) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size / 2, 0, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 182, 193, ${this.opacity})`;
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < 100; i++) {
            petals.push(new Petal());
        }

        function drawTree() {
            const centerX = width * 0.7;
            const bottomY = height;

            // Draw trunk
            ctx.beginPath();
            ctx.moveTo(centerX, bottomY);
            ctx.quadraticCurveTo(centerX - 20, bottomY - 100, centerX - 10, bottomY - 250);
            ctx.lineWidth = 15;
            ctx.strokeStyle = '#2d1b0d';
            ctx.stroke();

            // Draw branches and blossoms (Simplified)
            function drawBranch(x, y, length, angle, thickness) {
                if (length < 10) {
                    // Draw blossom
                    ctx.beginPath();
                    ctx.arc(x, y, Math.random() * 5 + 3, 0, Math.PI * 2);
                    ctx.fillStyle = '#fbcfe8';
                    ctx.fill();
                    return;
                }

                const endX = x + Math.cos(angle) * length;
                const endY = y + Math.sin(angle) * length;

                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(endX, endY);
                ctx.lineWidth = thickness;
                ctx.strokeStyle = '#2d1b0d';
                ctx.stroke();

                drawBranch(endX, endY, length * 0.75, angle - 0.4, thickness * 0.7);
                drawBranch(endX, endY, length * 0.75, angle + 0.4, thickness * 0.7);
            }

            drawBranch(centerX - 10, bottomY - 250, 80, -Math.PI / 2, 8);
        }

        function drawStars() {
            ctx.fillStyle = "white";
            for(let i=0; i<150; i++) {
                const x = (i * 137.5) % width;
                const y = (i * 221.7) % (height * 0.6);
                ctx.globalAlpha = Math.random() * 0.5 + 0.2;
                ctx.fillRect(x, y, 1, 1);
            }
            ctx.globalAlpha = 1;
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            drawStars();
            drawTree();

            petals.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        window.onload = animate;
    </script>
</body>
</html>
