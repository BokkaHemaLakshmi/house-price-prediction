<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>calculator</title>
    <style>
        body{
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>
        Calaculator
    </h1>
    <p> Enter the number 1 </p>
    <input type="text" id ="num1" placeholder="Enter the number"/>
    <p>Enter the number 2</p>
    <input type="text" id ="num2" placeholder="Enter the number"/>
    <p> Enter the symbol</p>
    <input type="text"  id="oper" placeholder="Enter the operator"/>
     <br><br>
    <button onclick ="num()"> Calucalate</button>
    <br>
    <p id="answer"></p>
    <script>
        
       function num()
       {
         let result = document.getElementById("answer");
         let number1 = document.getElementById("num1").value;
          let number2 = document.getElementById("num2").value;
          let operator = document.getElementById("oper").value;
          if (operator === "+")
          {
                let a ;
                a = parseInt(number1) + parseInt(number2);
                result.innerHTML = "result :"+ a;
          }
          else if (operator === "-")
          {
                let a ;
                a = parseInt(number1) - parseInt(number2);
                result.innerHTML = "result :"+ a;
          }
          else if (operator === "/")
          {
                let a ;
                a = parseInt(number1) / parseInt(number2);
                result.innerHTML = "result :"+ a;
          }
          else if (operator === "*")
          {
                let a ;
                a = parseInt(number1) * parseInt(number2);
                result.innerHTML = "result :"+ a;
          }
          else if (operator === "%")
          {
                let a ;
                a = parseInt(number1) % parseInt(number2);
                result.innerHTML = "result :"+ a;
          }
          
       }
    </script>
</body>
</html>
